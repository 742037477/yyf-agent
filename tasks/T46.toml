# m2k task contract for card T46, executed by DeepSeek (大肥鱼, worker) and reviewed by GLM-5.3 on GitHub (m2k-task).
# The card is done in six runs on its branch; each run adds one part (see the goal and tasks/T46_check.py --part).
[task]
id = "T46-p6-run-3"         # rework 1 (run-2 failed only because the owner's check could not write into the read-only workspace)
goal = '''REWORK 1 of card tasks/T46-stage5-attack-drill.md (PR #49). Edit m2k/accept.py only; do NOT explore.
CI runs `python -m m2k accept --offline` with its default, relative records folder (.m2k). Two places in m2k/accept.py
then use paths that are only right when the current folder is the repository root:
- _witness: the OBS witness process always runs with the framework code folder as its working folder, so relative key
  and log paths point to the wrong place;
- s_restart_ledger: git commands run with cwd=d.base but get paths that are also relative.

STEP 1: two edit_file calls in m2k/accept.py, nothing else changes. Replace exactly
    path, log = b.base / f"{name}.pem", b.base / f"{name}.jsonl"
with
    path, log = (b.base / f"{name}.pem").resolve(), (b.base / f"{name}.jsonl").resolve()
and replace exactly
    remote, repo = d.base / "remote.git", d.base / "anchors-clone"
with
    remote, repo = (d.base / "remote.git").resolve(), (d.base / "anchors-clone").resolve()

STEP 2: run `{python} tasks/T46_check.py --part 6` (it now runs the scenarios from a temporary folder with a relative
--dir, like CI) and fix until it prints T46 CHECK OK; then finish.
For run_command the arguments are {"command": "..."} (not nested in another "args").'''
workspace = ".."
tools = ["list_files", "read_file", "write_file", "edit_file", "run_command"]
constraints = [
  "Only edit m2k/accept.py (at most 150 added lines in total for parts 5 and 6). Do not modify any other file.",
  "Never change the kernel. If an attack succeeds, keep the test and mark it @unittest.expectedFailure (only a21 may be).",
  "Standard library unittest only; temporary folders and keys generated by the tests only; no network; must pass on Windows and Linux.",
  "Never read, print or copy any key file except the ones your own tests create.",
]
protected = [
  "AGENTS.md", "m2k/trust.py", "m2k/kernel.py", "m2k/gates.py", "m2k/worker.py", "m2k/ledger.py", "m2k/verify.py",
  "m2k/tools.py", "m2k/contract.py", "m2k/models.py", "m2k/cli.py", "m2k/sandbox.py", "m2k/types.py", "m2k/obs.py",
  "m2k/adjudicate.py", "m2k/anchor.py", "m2k/delivery.py", "m2k/fingerprint.py", "tools/task_result.py", "tests/test_stage5_attack.py",
  "tests/helpers.py", "tests/test_release.py", "tests/test_obs.py", "tests/test_anchor.py", "tests/test_delivery.py",
  "tests/test_fingerprint.py", "tests/test_task_tree.py",
  "tasks/T46-stage5-attack-drill.md", "tasks/T46.toml",
]

[acceptance]
files = ["tasks/T46_check.py"]
command = "{python} tasks/T46_check.py --part 6"
timeout_s = 1200

[budget]                    # the charter caps in trust/test/caps.toml
max_rounds = 40
max_model_calls = 44
max_tokens = 3000000
max_commands = 20
